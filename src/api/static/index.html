<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchGraph-RAG · AI Engineering Workbench</title>
<link rel="stylesheet" href="/static/app.css?v=9">
<link rel="stylesheet" href="/static/workspace.css?v=9">
</head>
<body class="is-landing">
<div class="ambient" aria-hidden="true"></div>

<button id="sb-open" class="sb-open" type="button" title="Open sidebar" aria-label="Open sidebar" aria-controls="sidebar" aria-expanded="false">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="3" width="18" height="18" rx="3"></rect><line x1="9" y1="3" x2="9" y2="21"></line>
  </svg>
</button>

<aside id="sidebar" class="sidebar" aria-label="Navigation">
  <div class="sb-top">
    <div class="sb-brand"><span class="logo-dot"></span><span>ArchGraph-RAG</span></div>
    <button id="sb-close" class="sb-icon-btn" type="button" title="Collapse sidebar" aria-label="Collapse sidebar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="3"></rect><line x1="9" y1="3" x2="9" y2="21"></line>
      </svg>
    </button>
  </div>

  <button id="nav-new" class="sb-new" type="button">
    <span class="sb-plus" aria-hidden="true">+</span>
    <span>New Query</span>
  </button>

  <nav class="sb-nav" aria-label="Primary pages">
    <div class="sb-section-label">Workspace</div>
    <button type="button" class="nav-item active" data-page="ask" aria-current="page">
      <span class="nav-ico" aria-hidden="true">◈</span>
      <span>Ask &amp; Explore</span>
    </button>
    <button type="button" class="nav-item" data-page="corpus">
      <span class="nav-ico" aria-hidden="true">▤</span>
      <span>Research Corpus</span>
      <span id="sb-corpus-count" class="nav-badge">35</span>
    </button>
  </nav>
</aside>

<main id="app">
  <section id="landing" class="landing">
    <h1>ArchGraph-RAG</h1>
    <p class="subtitle">Frontier LLM Systems &amp; Architecture Engineering (2017–2026) · Hybrid KG-RAG</p>
    <div id="cards" class="cards" aria-label="Sample questions"></div>
  </section>

  <section id="workspace" class="workspace" aria-live="polite">
    <div id="history" class="history"></div>

    <article id="active-turn" class="turn">
      <div class="q-row"><div id="q-text" class="q-bubble"></div></div>
      <div class="answer-card">
        <div class="answer-head"><span class="logo-dot"></span><span>ArchGraph-RAG</span><span id="ans-meta" class="meta"></span></div>
        <div id="answer" class="answer"></div>
        <div id="cite-pop" class="cite-pop" hidden></div>
        <footer id="meter" class="meter"></footer>
      </div>
    </article>

    <div id="frames" class="split">
      <section class="screen graph-screen">
        <div class="screen-head">
          <div class="seg" id="graph-view" role="tablist">
            <button type="button" data-view="search" class="on" role="tab">Search Subgraph</button>
            <button type="button" data-view="full" role="tab">Full 35-Paper Graph</button>
          </div>
          <label class="chk" id="chunks-toggle" title="Include :Chunk nodes and MENTIONED_IN / IN_PAPER links">
            <input type="checkbox" id="chunks"> + Chunk Nodes</label>
          <label class="chk" id="labels-toggle" title="Hide node and edge text labels">
            <input type="checkbox" id="hide-labels"> Hide Labels</label>
          <input id="graph-filter" class="filter" type="search" placeholder="Filter nodes..." aria-label="Filter graph nodes">
          <button type="button" id="fit" class="ghost" title="Zoom to fit">Fit</button>
        </div>
        <div class="graph-wrap">
          <svg id="graph" role="img" aria-label="Knowledge graph"></svg>
          <div id="inspector" class="inspector" hidden></div>
        </div>
        <footer class="graph-foot">
          <div id="legend" class="legend"></div>
          <div id="graph-stats" class="graph-stats"></div>
        </footer>
      </section>

      <section class="screen funnel-screen">
        <div class="screen-head">
          <h2>Retrieval Flow</h2>
          <div class="seg" id="flow-view" role="tablist">
            <button type="button" data-flow-view="trace" class="on" role="tab">This Query's Flow</button>
            <button type="button" data-flow-view="full" role="tab">Full Architecture</button>
          </div>
          <span id="flow-pattern-badge" class="pattern-badge" hidden></span>
          <span id="flow-sub" class="muted"></span>
        </div>
        <div class="flow-scroll"><div id="flow" class="flow"></div></div>
      </section>
    </div>
  </section>

  <section id="corpus-view" class="corpus-view" aria-label="Research Corpus" hidden>
    <header class="corpus-head">
      <h1 id="corpus-title">Research Corpus</h1>
      <p id="corpus-sub" class="corpus-sub"></p>
    </header>
    <div class="corpus-bar">
      <div id="corpus-pills" class="corpus-pills" role="tablist" aria-label="Filter by pillar"></div>
      <span id="corpus-match" class="corpus-match"></span>
    </div>
    <div id="corpus-lists" class="corpus-lists"></div>
  </section>

  <div id="status" class="status" role="status"></div>
</main>

<form id="composer" class="composer" autocomplete="off">
  <textarea id="question" rows="1" maxlength="2000" placeholder="Ask a deep multi-hop question about LLM architectures..." required></textarea>
  <div class="composer-row">
    <label class="pill-select" title="Generation model"><select id="model"></select></label>
    <div class="right">
      <button id="send" class="send" type="submit" aria-label="Send">&#8594;</button>
    </div>
  </div>
</form>

<script src="/static/core.js?v=9"></script>
<script src="/static/graph.js?v=9"></script>
<script src="/static/graph_render.js?v=9"></script>
<script src="/static/graph_inspect.js?v=9"></script>
<script src="/static/funnel.js?v=9"></script>
<script src="/static/panels.js?v=9"></script>
<script src="/static/corpus.js?v=9"></script>
</body>
</html>
