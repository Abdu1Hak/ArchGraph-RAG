markdown: |
  # Scaling Vision Transformers to 22 Billion Parameters

  {BANNER}

  ## Abstract

  ViT-22B is a 22-billion-parameter Vision Transformer trained with a recipe for highly efficient and stable training.

  ## 3 Model

  At this scale, attention logits in some heads grow without bound, producing nearly one-hot attention weights and a divergent training loss.

  QK-Norm applies LayerNorm to the queries and keys before the dot-product attention, which keeps the attention logits bounded.

  ViT-22B adopts QK-Norm in every attention layer, uses parallel attention and feed-forward layers, and omits biases in the QKV projections and LayerNorms.
