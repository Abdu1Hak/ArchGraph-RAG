  ## 2.5 Normalization Placement

  LLaMA's Pre-RMSNorm combines the Pre-LN placement of Xiong et al. (2020), normalizing the input of each sub-layer, with RMSNorm in place of LayerNorm.

  Normalizing the input of each transformer sub-layer instead of its output, as GPT-3 also does, improves training stability.
