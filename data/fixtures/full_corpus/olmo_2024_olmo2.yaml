markdown: |
  # 2 OLMo 2 Furious

  {BANNER}

  ## 2 Architecture

  OLMo 2 moves from a non-parametric layer norm to RMSNorm, and its reordered norm replaces the pre-norm placement by normalizing the outputs of the attention and feed-forward blocks instead of their inputs.

  OLMo 2 adds QK-Norm, applying RMSNorm to the queries and keys before the attention computation, to stabilize training.

  ## 3 Training

  OLMo 2 uses a two-stage curriculum that finishes pre-training with a mid-training stage on the high-quality Dolmino Mix 1124 data.

  OLMo 2 7B and 13B are fully open models trained on up to 5 trillion tokens.
