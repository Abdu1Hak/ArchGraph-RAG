markdown: |
  # FlashAttention-2: Faster Attention with Better Parallelism and Work Partitioning

  {BANNER}

  ## Abstract

  FlashAttention-2 improves on FlashAttention with better work partitioning, reaching around 2x speedup and 50-73% of the theoretical maximum FLOPs/s on A100 GPUs.

  ## 3 Method

  FlashAttention-2 reduces the number of non-matmul FLOPs, parallelizes the attention computation over the sequence length dimension in addition to batch and heads, and distributes work between warps to reduce shared-memory communication.

  FlashAttention-2 supports multi-query attention and grouped-query attention natively.
