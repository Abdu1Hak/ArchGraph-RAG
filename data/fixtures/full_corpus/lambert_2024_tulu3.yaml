markdown: |
  # Tulu 3: Pushing Frontiers in Open Language Model Post-Training

  {BANNER}

  ## Abstract

  Tulu 3 is a family of fully open post-trained models built on Llama 3.1 base models, with all data, code and training recipes released.

  ## 3 Recipe

  The Tulu 3 recipe applies supervised fine-tuning, then Direct Preference Optimization on on-policy preference data, then Reinforcement Learning with Verifiable Rewards (RLVR).

  RLVR trains the model with PPO-style reinforcement learning where the reward is given only when a verification function confirms the answer is correct, instead of using a learned reward model.

  ## 4 Results

  Tulu 3 70B outperforms Llama 3.1 Instruct 70B and Qwen 2.5 Instruct 72B on the average of its evaluation suite.
