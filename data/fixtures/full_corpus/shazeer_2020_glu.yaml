paper_id: shazeer_2020_glu
markdown: |
  # GLU Variants Improve Transformer

  {BANNER}

  ## Abstract

  Gated Linear Units consist of the component-wise product of two linear projections, one of which is first passed through a sigmoid function.

  We test variants of GLU in the feed-forward sublayers of the Transformer, using nonlinear functions other than sigmoid such as GELU and Swish.

  ## 2 Gated Linear Units in Transformers

  SwiGLU replaces the first linear layer and the ReLU activation of the feed-forward network with Swish(xW) * xV, followed by the output projection.

  To keep the parameter count and computation constant, the hidden dimension d_ff of the gated variants is reduced by a factor of 2/3.

  ## 3 Results

  GEGLU and SwiGLU produce the best perplexities on the span-filling pre-training objective and improve downstream GLUE and SuperGLUE scores.
