  ## 5.4 Residual Connections and Layer Normalization

  The output of each sub-layer is LayerNorm(x + Sublayer(x)): layer normalization is applied after the residual addition, an arrangement later called Post-LN.

  Post-LN places LayerNorm on the main residual path between blocks, so gradients near the output layers are large at initialization and training relies on a learning-rate warm-up stage.

  We use a warm-up of 4000 steps during which the learning rate increases linearly, and decrease it proportionally to the inverse square root of the step number afterwards.
