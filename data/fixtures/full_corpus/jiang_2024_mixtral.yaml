markdown: |
  # Mixtral of Experts

  {BANNER}

  ## Abstract

  Mixtral 8x7B is a Sparse Mixture of Experts (SMoE) language model with the same architecture as Mistral 7B, except that each layer is composed of 8 feedforward blocks (experts).

  For every token, at each layer, a router network selects two experts to process the current state and combine their outputs.

  ## 2 Architecture

  Each token has access to 47B parameters but only uses 13B active parameters during inference.

  Mixtral uses grouped-query attention, SwiGLU experts and a context window of 32k tokens.

  ## 3 Results

  Mixtral outperforms Llama 2 70B and matches or exceeds GPT-3.5 across most benchmarks, with a large lead on mathematics and code generation.
