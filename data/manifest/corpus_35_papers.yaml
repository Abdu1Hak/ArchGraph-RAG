# Curated 35-Paper Evolutionary Spine (2017 - 2026)
# Frontier LLM Systems & Architecture Engineering across 5 interconnected pillars.

title: "Research Corpus"
subtitle: "35 foundational arXiv papers (2017–2026) indexed across 5 LLM systems pillars."

pillars:
  - id: "core_block"
    name: "1. Core Transformer Block & Residuals"
    summary: "Layer normalization, activations, residual streams, and conditional memory."
  - id: "attention_sparsity"
    name: "2. Attention & Sparse Compute"
    summary: "KV-cache compression, hybrid local/global attention, and hardware-aligned sparsity."
  - id: "scaling_context"
    name: "3. Scaling, Context & Pre-Training"
    summary: "Compute-optimal scaling laws, positional encoding, long-context mid-training, and FP8 MoE pre-training."
  - id: "post_training_rlvr"
    name: "4. Post-Training & RLVR Reasoning"
    summary: "RLHF/PPO, RLAIF, DPO, PRMs, GRPO, and 2025–2026 reinforcement learning for verifiable reasoning."
  - id: "inference_kernels"
    name: "5. Inference Systems & GPU Kernels"
    summary: "KV-cache paging, prefix caching, quantization, speculative decoding, and Hopper/Blackwell FlashAttention kernels."

