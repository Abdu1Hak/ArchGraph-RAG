[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-arch-kg-rag"
version = "0.1.0"
description = "Hybrid Knowledge Graph & Vector RAG over Foundational LLM Architecture Papers (2017-2025)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "google-genai>=2.30.1",
    "neo4j>=5.20.0",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.3.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_default_fixture_loop_scope = "function"
